<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARCANA — 午夜占卜室</title>
  <meta name="description" content="午夜占卜室：静心、问卜、凭直觉抽牌。22 张大阿卡纳，单张与三张牌阵，星空与月相之下。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/tarot/style.css" />
</head>
<body>
  <div class="stage">
    <div class="nebula"></div>
    <div class="stars" id="stars"></div>
    <div class="stars2" id="stars2"></div>

    <!-- zodiac wheel: built by app.js, ultra-slow rotation -->
    <div class="wheel-wrap" aria-hidden="true">
      <svg viewBox="0 0 400 400" fill="none" stroke="#C9A227" stroke-width=".8">
        <circle cx="200" cy="200" r="196" stroke-width="1"/>
        <circle cx="200" cy="200" r="168"/>
        <circle cx="200" cy="200" r="120"/>
        <circle cx="200" cy="200" r="52"/>
        <g id="spokes"></g>
        <g id="ticks"></g>
        <g id="constellation"></g>
      </svg>
    </div>

    <main class="layer">
      <!-- top bar: brand + living moon -->
      <div class="topbar">
        <div class="brand"><span class="mark">✦ ARCANA</span><span class="zh">塔罗</span></div>
        <div class="moon-widget">
          <div class="txt"><div class="phase" id="moon-phase">—</div><div class="say">今夜宜问卜</div></div>
          <svg id="moon-svg" viewBox="0 0 40 40" aria-hidden="true"></svg>
        </div>
      </div>

      <!-- scene 1: choose a spread -->
      <section class="scene active" id="scene-choose">
        <div class="hero">
          <div class="orn">✦ ✧ ✦</div>
          <h1>塔 罗</h1>
          <div class="sub">THE <b>MIDNIGHT</b> SÉANCE · 大阿卡纳 · 二十二</div>
        </div>

        <div class="ritual">
          <span class="label">问 卜</span>
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <textarea id="question" maxlength="60" placeholder="静心 · 默念你的问题，或写在这里…"></textarea>
        </div>

        <div class="spread-pick">
          <button class="engrave" data-spread="one">今日一牌 · ONE</button>
          <button class="engrave" data-spread="three">三张牌阵 · 三世</button>
        </div>

        <div class="hint hint-static">塔罗是一面镜子 · 它照见的是你自己</div>
      </section>

      <!-- scene 2: draw from the fan -->
      <section class="scene" id="scene-draw">
        <div class="hint">深呼吸 · 凭直觉选择 <b id="pick-count">一张牌</b></div>
        <div class="slots" id="slots"></div>
        <div class="fan-scroll"><div class="fan" id="fan"></div></div>
        <div class="actions">
          <button class="engrave" id="back-choose">← 换牌阵</button>
        </div>
      </section>

      <!-- scene 3: reveal + reading -->
      <section class="scene" id="scene-reveal">
        <div class="hint" id="reveal-hint">牌面已启</div>
        <div class="slots" id="reveal-slots"></div>
        <div class="reading" id="reading"></div>
        <div class="actions">
          <button class="engrave" id="again">↺ 再抽一次</button>
          <button class="engrave" id="change-spread">换牌阵</button>
        </div>
      </section>

      <div class="foot">AS ABOVE, SO BELOW · 如在其上，如其在下</div>
    </main>

    <div class="grain"></div>
  </div>

  <button id="mute" class="engrave mute-btn" aria-pressed="false" title="声音开关">声音 开</button>
  <script type="module" src="/tarot/app.js"></script>
</body>
</html>
